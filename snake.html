<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghost Snake Game</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 50% 0%, #3b1d5e 0%, rgba(59,29,94,0) 60%),
      radial-gradient(ellipse at 50% 100%, #7f1d1d 0%, rgba(127,29,29,0) 55%),
      linear-gradient(180deg, #120a24 0%, #0b0618 100%);
    color: #e2e8f0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    user-select: none;
    overflow-x: hidden;
  }

  /* ---------- Title ---------- */
  h1 {
    margin: 0 0 14px;
    font-size: 34px;
    letter-spacing: 4px;
    font-weight: 900;
    background: linear-gradient(180deg, #ffffff 0%, #fecaca 40%, #f87171 70%, #b91c1c 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 3px 0 #450a0a) drop-shadow(0 8px 14px rgba(248,113,113,0.45));
  }

  /* ---------- Score cards (glass) ---------- */
  .scores { display: flex; gap: 18px; margin-bottom: 18px; }
  .card {
    position: relative;
    min-width: 130px;
    padding: 10px 18px 12px;
    border-radius: 14px;
    text-align: center;
    background: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.02) 100%);
    border: 1px solid rgba(255,255,255,0.22);
    box-shadow:
      0 10px 24px rgba(0,0,0,0.55),
      0 2px 0 rgba(255,255,255,0.15) inset,
      0 -8px 16px rgba(0,0,0,0.25) inset;
    backdrop-filter: blur(6px);
    overflow: hidden;
  }
  .card::before {              /* gloss shine on the top half */
    content: "";
    position: absolute;
    left: 0; right: 0; top: 0; height: 48%;
    background: linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0));
    border-radius: 14px 14px 60% 60% / 14px 14px 20px 20px;
    pointer-events: none;
  }
  .card .label { font-size: 11px; letter-spacing: 2px; color: #cbd5e1; text-transform: uppercase; }
  .card .value {
    font-size: 28px; font-weight: 900; color: #86efac;
    text-shadow: 0 2px 0 #14532d, 0 0 14px rgba(74,222,128,0.7);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Board (3D tilt + bevelled frame) ---------- */
  .stage { perspective: 900px; padding: 10px 0 24px; }
  .wrap {
    position: relative;
    padding: 12px;
    border-radius: 22px;
    background: linear-gradient(145deg, #b91c1c 0%, #7f1d1d 35%, #450a0a 70%, #2a0606 100%);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.5) inset,
      0 -3px 6px rgba(0,0,0,0.5) inset,
      0 6px 0 #2a0606,
      0 12px 0 #1c0404,
      0 34px 40px rgba(0,0,0,0.65),
      0 0 60px rgba(239,68,68,0.18);
    transform: rotateX(14deg);
    transform-origin: 50% 80%;
    transition: transform 0.4s ease;
  }
  .wrap:hover { transform: rotateX(6deg); }
  canvas {
    display: block;
    max-width: 88vw;
    height: auto;
    border-radius: 12px;
    box-shadow:
      0 0 0 2px rgba(0,0,0,0.55),
      0 6px 14px rgba(0,0,0,0.8) inset,
      0 -2px 0 rgba(255,255,255,0.15) inset;
  }
  /* glass reflection across the whole board */
  .glass {
    position: absolute;
    inset: 12px;
    border-radius: 12px;
    pointer-events: none;
    background:
      linear-gradient(115deg, rgba(255,255,255,0.20) 0%, rgba(255,255,255,0.06) 28%, rgba(255,255,255,0) 29%),
      linear-gradient(180deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 35%);
  }

  /* ---------- Overlay ---------- */
  #overlay {
    position: absolute;
    inset: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 35%, rgba(76,29,149,0.55), rgba(10,5,24,0.88));
    backdrop-filter: blur(3px);
    border-radius: 12px;
    text-align: center;
    gap: 8px;
  }
  #overlay h2 {
    margin: 0; font-size: 34px; font-weight: 900; letter-spacing: 2px;
    background: linear-gradient(180deg, #fff, #fca5a5 60%, #ef4444);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #450a0a) drop-shadow(0 0 14px rgba(248,113,113,0.5));
  }
  #overlay p { margin: 0; color: #cbd5e1; }

  /* ---------- Glossy 3D buttons ---------- */
  button {
    position: relative;
    margin-top: 12px;
    padding: 12px 30px;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 1px;
    color: #052e16;
    text-shadow: 0 1px 0 rgba(255,255,255,0.55);
    border: 1px solid #15803d;
    border-radius: 999px;
    cursor: pointer;
    background: linear-gradient(180deg, #bbf7d0 0%, #4ade80 45%, #16a34a 55%, #22c55e 100%);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.9) inset,
      0 -3px 6px rgba(0,0,0,0.25) inset,
      0 5px 0 #166534,
      0 10px 18px rgba(0,0,0,0.5),
      0 0 18px rgba(74,222,128,0.35);
    transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
    overflow: hidden;
  }
  button::before {            /* gloss strip */
    content: "";
    position: absolute;
    left: 8%; right: 8%; top: 4%; height: 42%;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(255,255,255,0.75), rgba(255,255,255,0.05));
    pointer-events: none;
  }
  button:hover { filter: brightness(1.08); transform: translateY(-1px); }
  button:active {
    transform: translateY(4px);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.7) inset,
      0 -3px 6px rgba(0,0,0,0.25) inset,
      0 1px 0 #166534,
      0 4px 8px rgba(0,0,0,0.5);
  }

  .hint { margin-top: 4px; font-size: 13px; color: #94a3b8; letter-spacing: 1px; }

  /* ---------- D-pad (touch) ---------- */
  .dpad { display: none; margin-top: 16px; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(2, 60px); gap: 8px; }
  .dpad button {
    margin: 0; padding: 0; font-size: 22px; border-radius: 16px; color: #e2e8f0;
    text-shadow: 0 2px 2px rgba(0,0,0,0.6);
    border: 1px solid #1e293b;
    background: linear-gradient(180deg, #64748b 0%, #334155 50%, #1e293b 55%, #334155 100%);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.4) inset,
      0 4px 0 #0f172a,
      0 8px 14px rgba(0,0,0,0.5);
  }
  .dpad button::before { border-radius: 14px; left: 6%; right: 6%; }
  .dpad button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(255,255,255,0.3) inset, 0 1px 0 #0f172a, 0 3px 6px rgba(0,0,0,0.5); }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  @media (hover: none) and (pointer: coarse) {
    .dpad { display: grid; }
    .wrap { transform: rotateX(8deg); }
  }
</style>
</head>
<body>
  <h1>👻 GHOST SNAKE</h1>
  <div class="scores">
    <div class="card"><div class="label">Score</div><div class="value" id="score">0</div></div>
    <div class="card"><div class="label">Best</div><div class="value" id="best">0</div></div>
  </div>
  <div class="stage">
    <div class="wrap">
      <canvas id="game" width="400" height="400"></canvas>
      <div class="glass"></div>
      <div id="overlay">
        <h2 id="title">Ghost Snake</h2>
        <p id="msg">Use arrow keys or WASD to move</p>
        <button id="startBtn">Start Game</button>
      </div>
    </div>
  </div>
  <div class="hint">Arrows / WASD to move &bull; Space to pause</div>
  <div class="dpad">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◀</button>
    <button class="down" data-dir="down">▼</button>
    <button class="right" data-dir="right">▶</button>
  </div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const msgEl = document.getElementById('msg');
  const startBtn = document.getElementById('startBtn');

  const CELL = 20;
  const COLS = canvas.width / CELL;
  const ROWS = canvas.height / CELL;

  const GHOST = '👻';
  let snake, dir, nextDir, food, score, timer, speed, running, paused;
  let best = 0;
  try { best = parseInt(localStorage.getItem('snakeBest')) || 0; } catch (e) {}
  bestEl.textContent = best;

  /* ---------- Pre-rendered glossy floor (drawn once) ---------- */
  const floor = document.createElement('canvas');
  floor.width = canvas.width;
  floor.height = canvas.height;
  (function buildFloor() {
    const f = floor.getContext('2d');
    const bg = f.createRadialGradient(200, 180, 40, 200, 200, 300);
    bg.addColorStop(0, '#7f1d1d');
    bg.addColorStop(1, '#2a0606');
    f.fillStyle = bg;
    f.fillRect(0, 0, floor.width, floor.height);

    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const px = x * CELL, py = y * CELL;
        const dark = (x + y) % 2 === 0;
        // tile body
        const g = f.createLinearGradient(px, py, px, py + CELL);
        g.addColorStop(0, dark ? 'rgba(255,255,255,0.07)' : 'rgba(255,255,255,0.12)');
        g.addColorStop(1, dark ? 'rgba(0,0,0,0.25)' : 'rgba(0,0,0,0.12)');
        f.fillStyle = g;
        f.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
        // bevel: light top/left edge, dark bottom/right edge
        f.fillStyle = 'rgba(255,255,255,0.14)';
        f.fillRect(px + 1, py + 1, CELL - 2, 1);
        f.fillRect(px + 1, py + 1, 1, CELL - 2);
        f.fillStyle = 'rgba(0,0,0,0.35)';
        f.fillRect(px + 1, py + CELL - 2, CELL - 2, 1);
        f.fillRect(px + CELL - 2, py + 1, 1, CELL - 2);
      }
    }
    // vignette
    const v = f.createRadialGradient(200, 200, 140, 200, 200, 290);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,0.55)');
    f.fillStyle = v;
    f.fillRect(0, 0, floor.width, floor.height);
  })();

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    speed = 130;
    paused = false;
    scoreEl.textContent = 0;
    placeFood();
  }

  function placeFood() {
    do {
      food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function start() {
    reset();
    running = true;
    overlay.style.display = 'none';
    clearInterval(timer);
    timer = setInterval(tick, speed);
    draw();
  }

  function setDir(x, y) {
    if (x === -dir.x && y === -dir.y) return; // no reversing
    nextDir = { x, y };
  }

  function tick() {
    if (paused) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        try { localStorage.setItem('snakeBest', best); } catch (e) {}
      }
      placeFood();
      if (speed > 60) {
        speed -= 4;
        clearInterval(timer);
        timer = setInterval(tick, speed);
      }
    } else {
      snake.pop();
    }
    draw();
  }

  function gameOver() {
    running = false;
    clearInterval(timer);
    titleEl.textContent = 'Game Over';
    msgEl.textContent = 'Your score: ' + score;
    startBtn.textContent = 'Play Again';
    overlay.style.display = 'flex';
  }

  /* ---------- Drawing helpers ---------- */
  function groundShadow(cx, cy, rx, ry, alpha) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,' + alpha + ')';
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // glossy glowing orb under a ghost, gives a raised 3D "bead" look
  function orb(cx, cy, r, c1, c2, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    const g = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.1, cx, cy, r);
    g.addColorStop(0, c1);
    g.addColorStop(1, c2);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    // specular highlight
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.ellipse(cx - r * 0.3, cy - r * 0.45, r * 0.45, r * 0.22, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    const t = performance.now();
    ctx.globalAlpha = 1;
    ctx.drawImage(floor, 0, 0);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = (CELL - 2) + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';

    // ---- food: floating, pulsing ghost ----
    if (food) {
      const fx = food.x * CELL + CELL / 2;
      const fy = food.y * CELL + CELL / 2;
      const bob = Math.sin(t / 220) * 2;
      const pulse = 0.5 + 0.5 * Math.sin(t / 300);
      groundShadow(fx, fy + 8, 7 - bob * 0.5, 2.6 - bob * 0.15, 0.45);
      ctx.save();
      const halo = ctx.createRadialGradient(fx, fy, 2, fx, fy, 18);
      halo.addColorStop(0, 'rgba(255,255,255,' + (0.35 + pulse * 0.25) + ')');
      halo.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = halo;
      ctx.fillRect(fx - 20, fy - 20, 40, 40);
      ctx.shadowColor = 'rgba(255,255,255,0.9)';
      ctx.shadowBlur = 10 + pulse * 6;
      ctx.fillText(GHOST, fx, fy + bob);
      ctx.restore();
    }

    // ---- snake: glossy orbs + ghosts, drawn tail to head ----
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const cx = s.x * CELL + CELL / 2;
      const cy = s.y * CELL + CELL / 2;
      const a = i === 0 ? 1 : Math.max(0.45, 1 - i * 0.03);

      groundShadow(cx + 1, cy + 8, 8, 3, 0.4 * a);

      if (i === 0) {
        orb(cx, cy - 1, 10, '#fecaca', '#b91c1c', 1);
        ctx.save();
        ctx.shadowColor = '#fca5a5';
        ctx.shadowBlur = 16;
        ctx.fillText(GHOST, cx, cy + 1);
        ctx.restore();
      } else {
        orb(cx, cy - 1, 9, '#fca5a5', '#7f1d1d', a * 0.9);
        ctx.globalAlpha = a;
        ctx.fillText(GHOST, cx, cy + 1);
        ctx.globalAlpha = 1;
      }
    }
    ctx.globalAlpha = 1;

    if (paused) {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.fillStyle = '#fff';
      ctx.shadowColor = 'rgba(248,113,113,0.9)';
      ctx.shadowBlur = 18;
      ctx.font = '900 30px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
      ctx.restore();
    }
  }

  // smooth animation loop (food bobbing / glow); game logic still runs on the timer
  function frame() {
    draw();
    requestAnimationFrame(frame);
  }

  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    const keys = ['arrowup','arrowdown','arrowleft','arrowright',' ','w','a','s','d'];
    if (keys.includes(k)) e.preventDefault();
    if (!running) {
      if (k === 'enter' || k === ' ') start();
      return;
    }
    if (k === 'arrowup' || k === 'w') setDir(0, -1);
    else if (k === 'arrowdown' || k === 's') setDir(0, 1);
    else if (k === 'arrowleft' || k === 'a') setDir(-1, 0);
    else if (k === 'arrowright' || k === 'd') setDir(1, 0);
    else if (k === ' ') { paused = !paused; draw(); }
  });

  // touch controls
  document.querySelectorAll('.dpad button').forEach(b => {
    b.addEventListener('click', () => {
      if (!running) return;
      const d = b.dataset.dir;
      if (d === 'up') setDir(0, -1);
      if (d === 'down') setDir(0, 1);
      if (d === 'left') setDir(-1, 0);
      if (d === 'right') setDir(1, 0);
    });
  });

  // swipe controls
  let tx, ty;
  canvas.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  canvas.addEventListener('touchend', e => {
    if (!running || tx == null) return;
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  startBtn.addEventListener('click', start);
  reset();
  frame();
})();
</script>
</body>
</html>
